[rpc]
# Relative to this TOML file; URLs live exclusively in CSV.
csv_file = "rpc.csv"

[explorers]
config_file = "explorers.toml"
secrets_file = "explorers.local.toml"

[analysis]
external = true
trace = true
time_budget_seconds = 60
max_requests = 300
max_frames = 1000
max_depth = 64
max_pages = 10
max_tokens = 20
max_addresses = 20

[wallets.treasury]
label = "资金钱包"
key_env = "TREASURY_PRIVATE_KEY"

[wallets.trading]
label = "交互钱包"
key_env = "TRADING_PRIVATE_KEY"

[wallets.watch]
label = "观察地址"
address = "0x0000000000000000000000000000000000000001"

